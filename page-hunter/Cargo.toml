[package]
name = "page-hunter"
description = "The pagination powerhouse, built with Rust"
version = "0.7.0"
authors = ["Juan Manuel Tamayo <jmtamayog23@gmail.com>"]
edition = "2024"
repository = "https://github.com/jmtamayo/page-hunter"
documentation = "https://docs.rs/page-hunter"
homepage = "https://github.com/jmtamayo/page-hunter"
license-file = "../LICENSE"
readme = "../README.md"
keywords = ["pagination", "paginator", "page_model"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
utoipa = { version = "6.0.0", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "mysql", "sqlite", "macros"] }
serde_json = "1.0.154"

[features]
serde = ["dep:serde"]
utoipa = ["dep:utoipa", "serde"]
sqlx = ["dep:sqlx"]

[package.metadata.docs.rs]
all-features = true
