name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  Format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "Repository: Fetch"
        uses: actions/checkout@v7

      - name: "Setup: Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: "Setup: Cargo Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Step: Check Format"
        run: cargo fmt --package page-hunter --all --check --verbose

  Lints:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: &feature_matrix
        include:
          - feature: no-features
            cargo_flags: ""
          - feature: all-features
            cargo_flags: "--all-features"
          - feature: serde
            cargo_flags: "--features serde"
          - feature: utoipa
            cargo_flags: "--features utoipa"
          - feature: sqlx
            cargo_flags: "--features sqlx"

    steps:
      - name: "Repository: Fetch"
        uses: actions/checkout@v7

      - name: "Setup: Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: "Setup: Cargo Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Step: Lints"
        run: cargo clippy --package page-hunter ${{ matrix.cargo_flags }} --all-targets --locked -- -D warnings

  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: *feature_matrix

    steps:
      - name: "Repository: Fetch"
        uses: actions/checkout@v7

      - name: "Setup: Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: "Setup: Cargo Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Step: Build"
        run: cargo check --package page-hunter ${{ matrix.cargo_flags }} --locked --verbose

  MSRV:
    # Keeps `rust-version` and the documented minimum Rust versions honest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.85"
            cargo_flags: "--features serde"
          - toolchain: "1.88"
            cargo_flags: "--features utoipa"
          - toolchain: "1.94"
            cargo_flags: "--all-features"

    steps:
      - name: "Repository: Fetch"
        uses: actions/checkout@v7

      - name: "Setup: Install Rust ${{ matrix.toolchain }}"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: "Setup: Cargo Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Step: Check with Rust ${{ matrix.toolchain }}"
        run: cargo check --package page-hunter ${{ matrix.cargo_flags }} --locked

  Docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: "Repository: Fetch"
        uses: actions/checkout@v7

      - name: "Setup: Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: "Setup: Cargo Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Step: Build Doc"
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --package page-hunter --all-features --document-private-items --locked --verbose

  Tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: test
          MYSQL_PASSWORD: docker
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utest -pdocker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: "Repository: Fetch"
        uses: actions/checkout@v7

      - name: "Setup: Install Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: "Setup: Install cargo-llvm-cov"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: "Setup: Cargo Cache"
        uses: Swatinem/rust-cache@v2

      - name: "Step: Doc Tests"
        run: cargo test --package page-hunter --all-features --doc --locked

      - name: "Step: Unit & Integration Tests (Postgres, MySQL, SQLite)"
        env:
          DB_USER: test
          DB_PASSWORD: docker
          DB_NAME: test
          DB_HOST: 127.0.0.1
          PG_DB_PORT: 5432
          MYSQL_DB_PORT: 3306
        run: cargo llvm-cov --package page-hunter --all-features --locked --codecov --output-path codecov.json

      - name: "Step: Publish Results"
        uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  Security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "Repository: Fetch"
        uses: actions/checkout@v7

      - name: "Step: Security Analysis"
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          log-level: warn
          manifest-path: ./page-hunter/Cargo.toml
