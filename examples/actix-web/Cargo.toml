[package]
name = "actix-web-example"
description = "An example of how to use actix-web with page-hunter"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
actix-web = { version = "4.20.0" }
reqwest = { version = "0.13.5", features = ["json"] }
utoipa = { version = "6.0.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["actix-web"] }
utoipa-redoc = { version = "7.0.0", features = ["actix-web"] }
utoipa-rapidoc = { version = "7.0.0", features = ["actix-web"] }
utoipa-scalar = { version = "0.4.0", features = ["actix-web"] }
serde = { version = "1.0.229", features = ["derive"] }
page-hunter = { path = "../../page-hunter", features=["utoipa"] }

[workspace]